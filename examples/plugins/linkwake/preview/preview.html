  * { box-sizing: border-box; }
  /* 主程序有这条兜底，预览页也得有，否则 [hidden] 会被组件的 display 盖掉 */
  [hidden] { display: none !important; }
  body {

  #toast {

    background: var(--fg); color: var(--panel); font-size: 12.5px;
    padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s;
    pointer-events: none; z-index: 99; max-width: 70vw;

  #toast.on { opacity: .94; }
  .fake-bar {

  }
  .fake-bar button {
    font: inherit; font-size: 12px; padding: 4px 9px; cursor: pointer;
    color: var(--fg-2); background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px;

</style>

  var COUNTS = { items: ENTRIES.length, links: 18, bt: 7, pan: 8, file: 1, web: 2 };

  ];

  function defApps() {
    var out = {};
    PROVIDERS.forEach(function (p) {
      out[p.id] = { mode: p.kind === "pan" ? "web" : "open",
                    scheme: "", exe: "", args: "{url}" };

  }

  window.__lwCalls = [];
  var cfg = { apps: defApps(),
              qb: { url: "http://127.0.0.1:8080", user: "admin",
                    savepath: "D:/downloads", passwordSet: true },
              aria2: { url: "", tokenSet: false, dir: "" } };

  function filterEntries(kind) {
    if (kind === "all" || !kind) return ENTRIES;
    return ENTRIES.map(function (e) {
      var gs = e.groups.filter(function (g) {
        if (kind === "dl") return g.kind !== "web";
        return g.kind === kind;
      });
      return Object.assign({}, e, { groups: gs, count: gs.length });
    }).filter(function (e) { return e.groups.length; });
  }

  window.__lwSetKind = function (kind) {
    window.__lwCounts = COUNTS;
    return { ok: true, entries: filterEntries(kind), counts: COUNTS,
             scanned: 120, kind: kind, providers: PROVIDERS,
             modes: [{ id: "open", text: "系统默认程序" },

             env: { canWake: true, dataDir: "（预览）", os: "nt" } };

  var toastEl = document.getElementById("toast");

    toast: function (m) {
      toastEl.textContent = m;
      toastEl.className = "on";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.className = ""; }, 2400);
    },
    registerView: function (spec) {
      window.ARR._views.push(spec);
      var host = document.getElementById("view");
      spec.mount(host, {
        toast: function (msg) {
          toastEl.textContent = msg;
          toastEl.className = "on";
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { toastEl.className = ""; }, 2400);
        },
        esc: function (s) {
          return String(s == null ? "" : s)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/>/g, "&gt;").replace(/"/g, "&quot;");

        openItem: function (id) { window.__lwCalls.push(["openItem", id]); },

          get: function (url) {
            if (/\/item\//.test(url || "")) {
              return Promise.resolve({ ok: false });   // 预览页没有阅读区

            var m = /kind=([a-z]+)/.exec(url || "");
            return Promise.resolve(window.__lwSetKind(m ? m[1] : "dl"));
          },
          send: function (method, url, body) {
            window.__lwCalls.push([method, url, body]);
            if (url.indexOf("/star") >= 0) {
              return Promise.resolve({ ok: true, item: body });
            }
            if (url.indexOf("/wake") >= 0) {
              return Promise.resolve({ ok: true, action: "open",
                                       detail: "已交给系统默认程序",
                                       url: body.url });
            }
            if (url.indexOf("/probe") >= 0) {
              return Promise.resolve({ ok: true, detail: "qBittorrent v4.6.2 已连通" });

                Object.keys(body.apps).forEach(function (k) {
                  cfg.apps[k] = body.apps[k];
                });
              }
              if (body && body.qb) cfg.qb.url = body.qb.url || cfg.qb.url;
              return Promise.resolve({ ok: true, cfg: cfg });
            }
            if (url.indexOf("/batch") >= 0) {
              return Promise.resolve({ ok: true, action: body.action,
                                       count: (body.urls || []).length });
            }
            return Promise.resolve({ ok: true });
          }
        }
      });
    }

  document.getElementById("again").addEventListener("click", function () {

    location.reload();

</script>

<script>

    return Promise.resolve(window.__lwSetKind(m ? m[1] : "dl"));

</script>
