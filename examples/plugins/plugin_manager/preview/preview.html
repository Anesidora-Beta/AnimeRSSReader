    border: 1px solid var(--line); background: var(--panel); color: var(--fg-2);
    border-radius: 6px; margin-right: 6px;

/* ---------- 极简 ARR 替身：只为让 view.js 能注册并被挂载 ---------- */
(function () {
  var views = {};
  window.ARR = {
    version: 1,
    registerView: function (spec) {
      views[spec.id] = spec;
      window.__SPEC = spec;
      return true;
    },
    getView: function (id) { return views[id] || null; },
    views: function () { return Object.keys(views); },
    on: function () {}, off: function () {}, emit: function () {},
    toast: function (m) { toast(m); },
    esc: esc,
    api: { get: get, send: send },
    openItem: function () {}
  };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function toast(msg) {
    var el = document.getElementById("demoToast");
    if (!el) {
      el = document.createElement("div");
      el.id = "demoToast";
      el.style.cssText = "position:fixed;left:50%;bottom:26px;transform:translateX(-50%);" +
        "background:#14171c;color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;" +
        "z-index:99;opacity:0;transition:opacity .18s";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = "1";
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.style.opacity = "0"; }, 1900);
  }

  /* 假的 GET：/api/pluginmgr、detail、file 三条 */
  function get(path) {
    return new Promise(function (resolve) {
      setTimeout(function () {
        if (path.indexOf("/api/pluginmgr/detail") === 0) {
          var id = decodeURIComponent((path.split("id=")[1] || "").split("&")[0]);
          resolve(DETAIL[id] ? Object.assign({ ok: true }, DETAIL[id])
                             : { ok: false, error: "没有这个插件" });
          return;
        }
        if (path.indexOf("/api/pluginmgr/file") === 0) {
          resolve({ ok: true, path: "__init__.py", text:
            "# 预览模式：真实文件内容在程序里读取\n" });
          return;
        }
        resolve(DATA);
      }, 30);
    });
  }

  /* 假的 POST：只回一个「预览模式不真的动文件」 */
  function send(method, path, body) {
    return new Promise(function (resolve) {
      setTimeout(function () {
        if (path.indexOf("/action") > 0) {
          resolve({ ok: true, steps: ["预览模式：不会真的移动目录"],
                    action: (body || {}).action });
          return;
        }
        resolve({ ok: true, path: "F:\\AnimeRSSReader\\plugins" });
      }, 120);
    });
  }

  window.addEventListener("load", function () {
    // 方便截图 / 直观看详情：?theme=dark&open=search
    var qs = location.search || "";
    if (/theme=dark/.test(qs)) setTheme("dark");

    var host = document.getElementById("pluginHost");
    if (window.__SPEC) window.__SPEC.mount(host, {
      id: "pluginmgr",
      api: { get: get, send: send },
      toast: toast, esc: esc,
      on: function () {}, off: function () {}, emit: function () {},
      openItem: function () {}, theme: "light", boot: {}, baseUrl: ""
    });

    var m = /open=([^&]+)/.exec(qs);
    if (m) {
      setTimeout(function () {
        var b = document.querySelector(
          '.pm-card[data-id="' + decodeURIComponent(m[1]) + '"] [data-act="toggle"]');
        if (b) b.click();
      }, 150);
    }
  });
})();
